app-id: app.lente.Lente
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: lente
finish-args:
  # Window
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  - --device=dri
  # Cameras (/dev/video*) and direct USB access (/dev/bus/usb) for the Elgato settings
  - --device=all
  # Photos in the Pictures folder
  - --filesystem=xdg-pictures
build-options:
  append-path: /usr/lib/sdk/rust-stable/bin
  env:
    CARGO_HOME: /run/build/lente/cargo
modules:
  - name: lente
    buildsystem: simple
    build-commands:
      - cargo --offline fetch --manifest-path Cargo.toml --verbose
      - cargo --offline build --release --verbose
      - install -Dm755 target/release/lente /app/bin/lente
      - install -Dm644 packaging/app.lente.Lente.desktop /app/share/applications/app.lente.Lente.desktop
      - install -Dm644 packaging/app.lente.Lente.svg /app/share/icons/hicolor/scalable/apps/app.lente.Lente.svg
      - install -Dm644 packaging/app.lente.Lente.metainfo.xml /app/share/metainfo/app.lente.Lente.metainfo.xml
    sources:
      - type: dir
        path: ../..
        skip:
          - target
          - shots
          - dist
      # Generated with flatpak-cargo-generator (see docs/BUILDING.md or the GitHub workflow)
      - cargo-sources.json
