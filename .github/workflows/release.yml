name: Publicar versión

# Al subir una etiqueta vX.Y.Z se construyen todos los paquetes y se adjuntan a la versión
# de GitHub: tarball, .deb, .rpm, AppImage, Flatpak, install.sh y SHA256SUMS.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  paquetes:
    runs-on: ubuntu-24.04
    # Ubuntu 22.04 (glibc 2.35): el programa funciona en distribuciones de 2022 en adelante.
    container:
      image: ubuntu:22.04
      options: --privileged
    steps:
      - name: Herramientas
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ca-certificates curl git build-essential pkg-config file xz-utils rpm \
            libxkbcommon-dev libwayland-dev libgl1-mesa-dev libegl1 libfuse2
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Compilar y probar
        run: |
          cargo build --release --locked
          cargo test --release --locked
      - name: Tarball
        run: LENTE_SKIP_BUILD=1 sh packaging/tarball/build-tarball.sh
      - name: Paquete .deb
        run: LENTE_SKIP_BUILD=1 sh packaging/deb/build-deb.sh
      - name: Paquete .rpm
        run: LENTE_SKIP_BUILD=1 sh packaging/rpm/build-rpm.sh
      - name: AppImage
        run: LENTE_SKIP_BUILD=1 sh packaging/appimage/build-appimage.sh
      - uses: actions/upload-artifact@v4
        with:
          name: paquetes
          path: dist/*

  flatpak:
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-24.08
      options: --privileged
    steps:
      - uses: actions/checkout@v4
      - name: Fuentes de Cargo para compilar sin red
        run: |
          pip3 install --break-system-packages aiohttp toml tomlkit || pip3 install aiohttp toml tomlkit
          curl -fsSL -o /tmp/flatpak-cargo-generator.py https://raw.githubusercontent.com/flatpak/flatpak-builder-tools/master/cargo/flatpak-cargo-generator.py
          python3 /tmp/flatpak-cargo-generator.py Cargo.lock -o packaging/flatpak/cargo-sources.json
      - name: Nombre del paquete
        id: v
        run: |
          V=$(grep -m1 '^version' Cargo.toml | cut -d '"' -f 2)
          echo "version=$V" >> "$GITHUB_OUTPUT"
      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: Lente-${{ steps.v.outputs.version }}.flatpak
          manifest-path: packaging/flatpak/app.lente.Lente.yml
          cache-key: flatpak-builder-${{ github.sha }}

  publicar:
    needs: [paquetes, flatpak]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: descargas
      - name: Reunir archivos y sumas de comprobación
        run: |
          mkdir dist
          find descargas -type f \( -name '*.tar.gz' -o -name '*.deb' -o -name '*.rpm' -o -name '*.AppImage' -o -name '*.flatpak' \) -exec cp {} dist/ \;
          sed "s#__REPO__#${GITHUB_REPOSITORY}#g" install.sh > dist/install.sh
          cd dist && sha256sum * > SHA256SUMS && cat SHA256SUMS
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist/*
          generate_release_notes: true
