[package]
name = "lente"
version = "0.4.0"
edition = "2021"
description = "Webcam control for UVC cameras (Elgato Facecam and others) on Linux"
license = "GPL-3.0-or-later"
readme = "README.md"
keywords = ["webcam", "uvc", "v4l2", "facecam", "linux"]
categories = ["multimedia::video", "hardware-support"]

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
egui = "0.37"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
libc = "0.2"
zune-jpeg = "0.5"
zune-core = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true

[profile.dev]
opt-level = 2
